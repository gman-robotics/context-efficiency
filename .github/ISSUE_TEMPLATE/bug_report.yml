name: Bug report
description: Something is wrong with the plugin, skills, or docs
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Keep reproduction steps short; link files or handoff paths instead of pasting long logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened vs what you expected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. …"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is fixed?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: e.g. `./scripts/check.sh`, verify skill, or manual Bot steps
    validations:
      required: true
