name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  markdown-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run repo check
        run: ./scripts/check.sh
      - name: Run check negative tests
        run: |
          ./scripts/test-check-negative-ref-link.sh
          ./scripts/test-check-negative-shortcut-ref.sh
          ./scripts/test-check-negative-pr-headers-fence.sh
          ./scripts/test-check-negative-pr-headers-tilde-fence.sh
          ./scripts/test-check-negative-shortcut-ref-in-fence.sh
          ./scripts/test-verify-ci-cleanup-exit-code.sh

  go-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: adapters/engram/go.sum
      - name: Prepare engram binary
        run: |
          source ./scripts/ci-prepare-engram.sh
          echo "ENGRAM_BIN=${ENGRAM_BIN}" >> "$GITHUB_ENV"
      - name: Compare extracted binary to pin binary_sha256
        shell: bash
        run: |
          set -euo pipefail
          bin="adapters/engram/.ci/engram"
          if [[ ! -f "${bin}" ]]; then
            echo "mismatch: missing ${bin}" >&2
            exit 1
          fi
          got="$(sha256sum "${bin}" | awk '{print $1}')"
          want="$(python3 -c 'import json; print(json.load(open("adapters/engram/pin.json", encoding="utf-8"))["binary_sha256"])')"
          if [[ -z "${got}" || "${got}" != "${want}" ]]; then
            echo "mismatch: got ${got} want ${want}" >&2
            exit 1
          fi
          echo "match ${got}"
      - name: Go unit and integration tests
        run: ./scripts/check-go.sh

  verify-context-efficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: adapters/engram/go.sum
      - name: Prepare engram binary
        run: |
          source ./scripts/ci-prepare-engram.sh
          echo "ENGRAM_BIN=${ENGRAM_BIN}" >> "$GITHUB_ENV"
      - name: Verify skill CI bundle
        run: skills/verify-context-efficiency/bin/verify-context-efficiency-ci
